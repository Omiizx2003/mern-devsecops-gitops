apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.mongo.replicaCount }}
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          ports:
            - containerPort: {{ .Values.mongo.service.port }}

          resources:
            requests:
              cpu: {{ .Values.mongo.resources.requests.cpu }}
              memory: {{ .Values.mongo.resources.requests.memory }}
            limits:
              cpu: {{ .Values.mongo.resources.limits.cpu }}
              memory: {{ .Values.mongo.resources.limits.memory }}

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: mongo
  ports:
    - port: {{ .Values.mongo.service.port }}
      targetPort: {{ .Values.mongo.service.port }}
  type: ClusterIP