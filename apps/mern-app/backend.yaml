apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mern-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 357199109816.dkr.ecr.ap-south-1.amazonaws.com/mern-devsecops-dev-backend:v1
          ports:
            - containerPort: 3500
          env:
            - name: PORT
              value: "3500"
            - name: MONGO_CONN_STR
              value: "mongodb://mongo:27017/tasks"
            - name: USE_DB_AUTH
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3500
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3500
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mern-app
spec:
  selector:
    app: backend
  ports:
    - port: 3500
      targetPort: 3500
  type: ClusterIP